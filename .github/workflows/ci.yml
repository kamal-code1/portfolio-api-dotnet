name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build PortfolioAPI.csproj -c Release
      - name: Tests
        run: dotnet test tests/PortfolioAPI.Tests -c Release --logger "console;verbosity=normal"
